server:
  port: 8085

spring:
  application:
    name: gateway-server

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  cloud:
    config:
      username: ${CONFIG_USERNAME}
      password: ${CONFIG_PASSWORD}
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "http://localhost:8088"
                  - "http://127.0.0.1:8088"
                  - "https://tubular-treacle-b17eba.netlify.app"
                  - "https://festie.site"
                  - "https://www.festie.site"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:https://festie-user-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/user-service/**
              filters:
                - StripPrefix=1

            - id: chat-service
              uri: ${CHAT_SERVICE_URL:https://festie-chat-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/chat-service/**
              filters:
                - StripPrefix=1
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

            - id: operation-service
              uri: ${OPERATION_SERVICE_URL:https://festie-operation-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/operation-service/**
              filters:
                - StripPrefix=1

            - id: event-service
              uri: ${EVENT_SERVICE_URL:https://festie-event-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/event-service/**
              filters:
                - StripPrefix=1

            - id: community-service
              uri: ${COMMUNITY_SERVICE_URL:https://festie-community-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/community-service/**
              filters:
                - StripPrefix=1

            - id: favorite-service
              uri: ${FAVORITE_SERVICE_URL:https://festie-favorite-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/favorite-service/**
              filters:
                - StripPrefix=1

            - id: notification-service-sse
              uri: ${NOTIFICATION_SERVICE_URL:https://festie-notification-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/notification-service/v1/notifications/subscribe
              filters:
                - StripPrefix=1
              metadata:
                response-timeout: 1800000
                connect-timeout: 3000

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:https://festie-notification-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/notification-service/**
              filters:
                - StripPrefix=1

            - id: calendar-service
              uri: ${CALENDAR_SERVICE_URL:https://festie-calendar-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/calendar-service/**
              filters:
                - StripPrefix=1

            - id: ai-service
              uri: ${AI_SERVICE_URL:https://festie-ai-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/ai-service/**
              filters:
                - StripPrefix=1

            # Swagger 전용 라우트
            - id: user-service-docs
              uri: ${USER_SERVICE_URL:https://festie-user-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/user-service/**
              filters:
                - RewritePath=/docs/user-service/(?<segment>.*), /$\{segment}

            - id: chat-service-docs
              uri: ${CHAT_SERVICE_URL:https://festie-chat-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/chat-service/**
              filters:
                - RewritePath=/docs/chat-service/(?<segment>.*), /$\{segment}

            - id: operation-service-docs
              uri: ${OPERATION_SERVICE_URL:https://festie-operation-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/operation-service/**
              filters:
                - RewritePath=/docs/operation-service/(?<segment>.*), /$\{segment}

            - id: event-service-docs
              uri: ${EVENT_SERVICE_URL:https://festie-event-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/event-service/**
              filters:
                - RewritePath=/docs/event-service/(?<segment>.*), /$\{segment}

            - id: community-service-docs
              uri: ${COMMUNITY_SERVICE_URL:https://festie-community-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/community-service/**
              filters:
                - RewritePath=/docs/community-service/(?<segment>.*), /$\{segment}

            - id: favorite-service-docs
              uri: ${FAVORITE_SERVICE_URL:https://festie-favorite-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/favorite-service/**
              filters:
                - RewritePath=/docs/favorite-service/(?<segment>.*), /$\{segment}

            - id: notification-service-docs
              uri: ${NOTIFICATION_SERVICE_URL:https://festie-notification-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/notification-service/**
              filters:
                - RewritePath=/docs/notification-service/(?<segment>.*), /$\{segment}

            - id: calendar-service-docs
              uri: ${CALENDAR_SERVICE_URL:https://festie-calendar-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/calendar-service/**
              filters:
                - RewritePath=/docs/calendar-service/(?<segment>.*), /$\{segment}

            - id: ai-service-docs
              uri: ${AI_SERVICE_URL:https://festie-ai-3ofsdptgra-du.a.run.app}
              predicates:
                - Path=/docs/ai-service/**
              filters:
                - RewritePath=/docs/ai-service/(?<segment>.*), /$\{segment}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://festie-zipkin:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 유저 서비스 (User)
        url: /docs/user-service/v3/api-docs
      - name: 채팅 서비스 (Chat)
        url: /docs/chat-service/v3/api-docs
      - name: 운영 서비스 (Operation)
        url: /docs/operation-service/v3/api-docs
      - name: 행사 서비스 (Event)
        url: /docs/event-service/v3/api-docs
      - name: 커뮤니티 서비스 (Community)
        url: /docs/community-service/v3/api-docs
      - name: 찜 서비스 (Favorite)
        url: /docs/favorite-service/v3/api-docs
      - name: 알림 서비스 (Notification)
        url: /docs/notification-service/v3/api-docs
      - name: 일정 서비스 (Calendar)
        url: /docs/calendar-service/v3/api-docs
      - name: AI 서비스 (Ai)
        url: /docs/ai-service/v3/api-docs
